<script>
  // Usage: index.html?run=test&scene=game&lang=en   scenes: intro_cast, game, arch, awards
  // Preview options: &t=start second &speed=playback rate &roles=0 (hide role badges)
  // Frame-by-frame rendering: add &render=1 (no realtime loop), then call window.seek(t) per frame;
  // window.sceneInfo() lists scenes and their lengths.
  window.Q = new URLSearchParams(location.search);
  window.RUN = Q.get('run') || 'test';
  window.LANG = Q.get('lang') === 'en' ? 'en' : 'ko';
  document.write('<script src="data/' + RUN + (LANG === 'en' ? '_en' : '') + '.js"><\/script>');
  document.write('<script src="data/season.js"><\/script>');  // awards scene data (optional)
</script>

<body>

<script>
(() => {
const G = window.GAME, L = LANG;
document.body.classList.toggle('en', L === 'en');
const tr = (ko, en) => (L === 'en' ? en : ko);
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = x => 1 - Math.pow(1 - clamp(x), 3);
const easeIn = x => Math.pow(clamp(x), 2);
const backOut = x => { x = clamp(x); const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const lerp = (a, b, x) => a + (b - a) * x;
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

const ROLE_NAME = { '마피아': tr('마피아', 'Mafia'), '경찰': tr('경찰', 'Detective'), '의사': tr('의사', 'Doctor'), '시민': tr('시민', 'Citizen') };
const ROLE_COLOR = { '마피아': 'var(--mafia)', '경찰': 'var(--police)', '의사': 'var(--doctor)', '시민': 'var(--citizen)' };
const ROLE_ICON = { '마피아': '🕶️', '경찰': '🔍', '의사': '💉', '시민': '🙂' };
const EMO = { '침착': '😐', '의심': '🤨', '확신': '😤', '당황': '😳', '억울': '😭', '웃음': '😆', '분노': '😡', '긴장': '😰' };
const SHOW_ROLES = Q.get('roles') !== '0';

// Seats: the original 9-chair layout (tuned for a 1920x1080 stage), resampled for any number of players
const SEAT9_X = [224, 410, 590, 776, 961, 1148, 1334, 1513, 1694];
const SEAT9_FOOT = [770, 745, 715, 690, 680, 690, 715, 745, 770];
const SEAT9_H = [330, 318, 306, 296, 292, 296, 306, 318, 330];
const NSEAT = G ? G.seats.length : 9;
const resample = arr => Array.from({ length: NSEAT }, (_, i) => {
  if (NSEAT === 9) return arr[i];
  const f = NSEAT === 1 ? 4 : i * 8 / (NSEAT - 1), a = Math.floor(f), b = Math.min(8, a + 1);
  return arr[a] + (arr[b] - arr[a]) * (f - a);
});
const SEAT_X = resample(SEAT9_X), SEAT_FOOT = resample(SEAT9_FOOT);
const SEAT_H = resample(SEAT9_H).map(h => h * Math.min(1.25, Math.max(0.8, 9 / Math.max(NSEAT, 1) * 0.55 + 0.45)));
// Picture or emoji avatar. h = avatar size in px when there is no picture
const IMG = (pl, h, attrs = '', cls = '') => pl.img
  ? `<img class="${cls}" src="${esc(cls === 'soft' ? (pl.img_soft || pl.img) : pl.img)}" ${attrs}>`
  : `<span class="av ${cls}" style="--h:${h}px;background:radial-gradient(circle at 35% 30%, ${pl.color}, ${pl.color}88 70%)" ${attrs.replace(/^style="/, 'data-x="')}>${esc(pl.emoji || '🙂')}</span>`;
const BG = (G && G.bg) || (window.SEASON && window.SEASON.bg), BG_BLUR = (G && G.bg_blur) || (window.SEASON && window.SEASON.bg_blur) || BG;

const SCENES = [
  { id: 'intro_cast', el: 's-intro', dur: 26, draw: drawIntro, label: '참가자·역할·우승 기준 소개' },
  { id: 'game', el: 's-game', dur: G ? G.total : 10, draw: drawGame, label: '게임 진행 (' + (G ? G.run : '') + ')' },

const head = c => { const i = seatOf[c]; return { x: SEAT_X[i], y: SEAT_FOOT[i] - SEAT_H[i] * 0.86 }; };

// ---- camera ----  screen = world * s + (tx, ty)
const WIDE = { s: 1, tx: 0, ty: 0 };
function fit(c) { const s = Math.max(1, c.s); return { s, tx: clamp(c.tx, 1920 - 1920 * s, 0), ty: clamp(c.ty, 1080 - 1080 * s, 0) }; }
function focus(wx, wy, s, fx, fy) { return fit({ s, tx: fx - s * wx, ty: fy - s * wy }); }
function close(c, v) {
  const i = seatOf[c], x = SEAT_X[i], f = SEAT_FOOT[i], h = SEAT_H[i];
  if (v === 0) return focus(x, f - h * 0.55, 2.3, 700, 560);
  if (v === 1) return focus(x, f - h * 0.66, 2.75, 960, 520);
  return focus(x, f - h * 0.55, 2.05, 1220, 580);
}
function lerpCam(a, b, k) { return { s: lerp(a.s, b.s, k), tx: lerp(a.tx, b.tx, k), ty: lerp(a.ty, b.ty, k) }; }
function punch(c, x) { // 1.0→1.08 (40ms 상승, 80ms 복귀) 화면 중심 기준
  const p = x < 0 ? 0 : x < 0.04 ? x / 0.04 : Math.max(0, 1 - (x - 0.04) / 0.08);
  const m = 1 + 0.08 * p;
  return fit({ s: c.s * m, tx: 960 - (960 - c.tx) * m, ty: 540 - (540 - c.ty) * m });
}
const CALL_LEN = 1.4;
function baseCam(e, lt) {
  if (!e) return WIDE;
  if (e.type === 'speech') {
    const co = e.callout;
    if (co && lt >= co.at && lt < co.at + CALL_LEN) return close(co.target, (e.idx + 1) % 3);
    return close(e.who, e.idx % 3);
  }
  if (e.type === 'execute') { const p = chest(e.who); return focus(p.x, p.y, 1 + 0.3 * ease(lt / 6), p.x, p.y); }
  if (e.type === 'death') { const p = chest(e.who); return focus(p.x, p.y, 1 + 0.2 * ease(lt / 4), p.x, p.y); }
  return WIDE;
}
function camAt(e, lt) {
  if (!e) return WIDE;
  const i = visIdx.get(e), prev = i > 0 ? VIS[i - 1] : null;
  let c = baseCam(e, lt);
  const TR = e.type === 'speech' ? 0.4 : 0.5;
  if (lt < TR && prev) c = lerpCam(baseCam(prev, prev.dur), baseCam(e, 0), ease(lt / TR));
  if (e.type === 'speech') {
    c = punch(c, lt - TR);
    const co = e.callout;
    if (co) {
      c = punch(c, lt - co.at);
      const back = lt - (co.at + CALL_LEN);
      if (back >= 0 && back < 0.25) c = lerpCam(close(co.target, (e.idx + 1) % 3), close(e.who, e.idx % 3), ease(back / 0.25));
    }
  }
  return c;
}

function gameState(t) {
  const st = { day: 1, phase: 'start', dead: {}, exec: {}, votes: {}, cur: null };
  for (const e of G.events) {
    const vis = !e.skip;
    if (vis && e.start > t) break;
    const lt = vis ? t - e.start : 1e9;
    if (vis && lt < e.dur) st.cur = e;
    switch (e.type) {
      case 'night': st.day = e.day; st.phase = 'night'; st.votes = {}; break;
      case 'mafia_pick': case 'doctor_save': case 'police_check': st.phase = 'night'; break;
      case 'death': st.phase = 'morning'; if (lt > 1.2) st.dead[e.who] = 'mafia'; break;
      case 'no_death': st.phase = 'morning'; break;
      case 'day': case 'speech': st.phase = 'talk'; break;
      case 'vote': st.phase = 'vote'; if (lt > 0.7) st.votes[e.target] = (st.votes[e.target] || 0) + 1; break;
      case 'execute': st.phase = 'exec'; if (lt > 2.6) { st.dead[e.who] = 'exec'; st.exec[e.who] = e.role; } break;
      case 'no_execute': st.phase = 'exec'; break;
      case 'end': st.phase = 'end'; break;
    }
  }
  return st;
}

function drawGame(t) {
  const st = gameState(t), e = st.cur, lt = e ? t - e.start : 0;
  const cam = camAt(e, lt);
  // 미세 흔들림 (클로즈업 진입·지목·밤 결과·처형만)
  let shake = 0;
  if (e && e.type === 'speech') {
    shake += 3 * clamp(1 - (lt - 0.4) / 0.2) * (lt > 0.4 ? 1 : 0);
    if (e.callout) { const x = lt - e.callout.at; if (x >= 0 && x < 0.3) shake += 14 * (1 - x / 0.3); }
  }
  if (e && e.type === 'death' && lt > 0.9) shake += 18 * Math.exp(-(lt - 0.9) * 3);
  if (e && e.type === 'no_execute') shake += 12 * Math.exp(-lt * 3);
  if (e && e.type === 'execute' && lt > 1.9) shake += 14 * Math.exp(-(lt - 1.9) * 4);
  const sx = shake * Math.sin(t * 93), sy = shake * Math.cos(t * 71);
  document.getElementById('cam').style.transform = `translate(${cam.tx + sx}px, ${cam.ty + sy}px) scale(${cam.s})`;
  const toS = p => ({ x: p.x * cam.s + cam.tx + sx, y: p.y * cam.s + cam.ty + sy });
  const k = clamp((cam.s - 1.05) / 0.8); // 클로즈업 정도
  const focusC = e && e.type === 'speech' ? (e.callout && lt >= e.callout.at && lt < e.callout.at + CALL_LEN ? e.callout.target : e.who) : null;
  const inCall = e && e.callout && lt >= e.callout.at && lt < e.callout.at + CALL_LEN;

  // 낮/밤
  const night = st.phase === 'night';
  let n = night ? 1 : 0;
  if (e && e.type === 'night') n = ease(lt / 1.2);
  if (e && (e.type === 'death' || e.type === 'no_death')) n = 1 - ease(lt / 1.4);
  document.getElementById('tint').style.background = `linear-gradient(rgba(10,22,70,${0.55 * n}), rgba(5,8,30,${0.62 * n})),` +
    `radial-gradient(ellipse at 50% 100%, rgba(255,40,40,${0.22 * n}), transparent 60%),` +
    `linear-gradient(rgba(255,170,70,${0.10 * (1 - n)}), rgba(255,140,40,${0.06 * (1 - n)}))`;
  document.getElementById('bgb').style.opacity = k;
  document.getElementById('fgb').style.opacity = k;
  document.getElementById('dim').style.opacity = 0.35 * k + 0.12 * n;

  // 집중선 (클로즈업 화자 뒤, world 좌표)
  const lines = document.getElementById('lines');
  if (focusC && k > 0.05) {
    const p = chest(focusC), col = inCall ? '#ff2a2a' : P[focusC].color;
    let s = '';
    for (let j = 0; j < 72; j++) {
      const a = (j / 72) * Math.PI * 2 + hash(j) * 0.05 + lt * 0.05;
      const r0 = 120 + hash(j + 9) * 60, r1 = r0 + 260 + hash(j + 4) * 520;
      s += `<line x1="${p.x + Math.cos(a) * r0}" y1="${p.y + Math.sin(a) * r0}" x2="${p.x + Math.cos(a) * r1}" y2="${p.y + Math.sin(a) * r1}" stroke="${j % 3 ? '#ffffff' : col}" stroke-width="${0.6 + hash(j + 2) * 0.9}" opacity="${(0.12 + hash(j + 5) * 0.22) * k * (inCall ? 1.6 : 1)}"/>`;
    }
    lines.innerHTML = s;
  } else lines.innerHTML = '';

  // 상단 바
  const PH = [['night', tr('🌙 밤', '🌙 NIGHT')], ['morning', tr('☀️ 아침', '☀️ MORNING')], ['talk', tr('💬 토론', '💬 TALK')], ['vote', tr('🗳️ 투표', '🗳️ VOTE')], ['exec', tr('⚖️ 처형', '⚖️ EXECUTION')]];
  setHTML(document.getElementById('top'), `<div id="dayb" class="disp">DAY ${st.day}</div>` +
    PH.map(([key, label], i) => (i ? '<span class="sep">›</span>' : '') + `<div class="ph ${st.phase === key ? 'on' : ''} ${key === 'night' ? 'night' : ''}">${label}</div>`).join('') +
    `<div id="runlabel">${esc(G.run)} · seed ${G.seed} · ${G.reveal ? tr('정체 공개', 'identities revealed') : tr('정체 비공개', 'anonymous')}</div>`);

  // 생존판
  const hl = e && e.who;
  setHTML(document.getElementById('roster'), `<h4 class="disp">${tr('생존자', 'PLAYERS')}</h4>` + SEATS.map(c =>
    `<div class="rrow ${st.dead[c] ? 'dead' : ''} ${hl === c ? 'hl' : ''}"><div class="face" style="border-color:${P[c].color}">${IMG(P[c], 22)}</div>` +
    `<span class="nm" style="color:${P[c].color}">${D(c)}</span><span class="md">${esc(P[c].model)}</span><span class="st">${st.exec[c] ? ROLE_ICON[st.exec[c]] : st.dead[c] ? '✖' : ''}</span></div>`).join(''));

  // 투표판
  const vp = document.getElementById('votes');
  const showV = st.phase === 'vote' || st.phase === 'exec';
  vp.style.display = showV ? 'block' : 'none';
  if (showV) {
    const rows = Object.entries(st.votes).sort((a, b) => b[1] - a[1]);
    const max = Math.max(1, ...rows.map(r => r[1]));
    setHTML(vp, `<h4 class="disp">${tr('🗳️ 득표', '🗳️ VOTES')}</h4>` + (rows.length ? rows.map(([c, v]) =>
      `<div class="vrow"><span class="nm" style="color:${P[c].color}">${D(c)}</span><div class="bar" style="width:${(v / max) * 120}px"></div><span class="n">${v}</span></div>`).join('')
      : `<div class="vrow" style="opacity:.6">${tr('투표 중…', 'voting…')}</div>`));
  }

  // 캐릭터
  SEATS.forEach((c, i) => {
    const d = document.getElementById('ch-' + i);
    let sc = 1, ty = 0, op = 1, f = [];
    if (st.dead[c]) { f.push('grayscale(1) brightness(.6)'); op = .5; }
    const soft = k > 0.02 && c !== focusC ? k : 0;
    if (soft) f.push(`brightness(${1 - 0.45 * k})`);
    if (e && e.who === c && e.type === 'vote') { sc = 1 + 0.1 * ease(lt / 0.3); ty = -Math.abs(Math.sin(lt * 7)) * 12 * Math.exp(-lt * 1.8); }
    if (c === focusC) ty = -Math.abs(Math.sin(lt * 6)) * 6 * Math.exp(-lt * 2);
    if (e && e.type === 'mafia_pick' && e.who === c) f.push('drop-shadow(0 0 22px #ff2b2b)');
    if (e && e.type === 'doctor_save' && e.who === c) f.push('drop-shadow(0 0 22px #3BE37A)');
    if (e && e.type === 'police_check' && e.who === c) f.push('drop-shadow(0 0 22px #3BA3FF)');
    let clip = 'none';
    if (e && e.type === 'execute' && e.who === c) { ty = easeIn((lt - 1.9) / 0.7) * 560; f = []; clip = `inset(-60px -60px ${Math.max(0, ty)}px -60px)`; }
    if (e && e.type === 'death' && e.who === c && lt < 1.2) { f = []; op = 1; }

    d.style.clipPath = clip;
    d.style.transform = `translateY(${ty}px) scale(${sc})`;
    d.style.opacity = op;
    const fs = f.join(' ') || 'none', sh = d.querySelector('.sharp'), so = d.querySelector('.soft');
    if (sh.style.filter !== fs) { sh.style.filter = fs; so.style.filter = fs; }
    sh.style.opacity = 1 - soft; so.style.opacity = soft;
    d.querySelector('.tag').style.opacity = 1 - k;
    const rb = d.querySelector('.role'); if (rb) rb.style.opacity = 1 - k;
    d.style.zIndex = c === focusC || (e && e.who === c) ? 5 : 1;
  });

  // 처형 구멍 (world, 캐릭터 뒤)
  const holes = document.getElementById('holes');
  if (e && e.type === 'execute' && lt > 1.75) {
    const i = seatOf[e.who], q = ease((lt - 1.75) / 0.2), w = 230 * q;
    holes.innerHTML = `<div class="abs" style="left:${SEAT_X[i] - w / 2}px;top:${SEAT_FOOT[i] - 26 * q}px;width:${w}px;height:${52 * q}px;border-radius:50%;background:radial-gradient(ellipse at 50% 40%, #000 55%, #2a0a0a 75%, transparent 78%);box-shadow:0 0 30px #ff2b2b66"></div>`;
  } else holes.innerHTML = '';

  // 스포트라이트 (wide 장면의 행동자·처형)
  const spot = document.getElementById('spot');
  let sp = null, spa = 0;
  if (e && ['vote', 'mafia_pick', 'doctor_save', 'police_check'].includes(e.type)) { sp = toS(chest(e.who)); spa = 0.45 * ease(lt / 0.4); }
  if (e && e.type === 'execute') {
    const cands = Object.entries(st.votes).sort((a, b) => b[1] - a[1]).slice(0, 2).map(r => r[0]);
    const other = cands.find(c => c !== e.who) || e.who;
    const sweep = lt < 1.4 ? (Math.floor(lt / 0.28) % 2 ? other : e.who) : e.who;
    sp = toS(chest(sweep)); spa = 0.78 * ease(lt / 0.5);
  }
  spot.style.background = sp ? `radial-gradient(circle ${e.type === 'execute' ? 200 * cam.s : 230}px at ${sp.x}px ${sp.y}px, rgba(255,240,200,.12), rgba(0,0,0,${spa}) 100%)` : 'none';
  // 비네트 (밤 결과·투표 결과·처형)
  let vg = 0;
  if (e && ['death', 'execute', 'no_execute', 'no_death'].includes(e.type)) vg = ease(lt / 0.5);
  document.getElementById('vign').style.background = `radial-gradient(ellipse at 50% 52%, transparent ${48 - 18 * vg}%, rgba(0,0,0,${0.55 + 0.35 * vg}) 100%)`;

  drawBanner(e, lt);
  drawSub(e, lt);
  drawClouds(e, lt, toS, inCall);
  drawFx(e, lt, toS, st);
}

function drawBanner(e, lt) {
  const b = document.getElementById('banner');
  const map = {
    setup: [tr('🎲 게임 시작', '🎲 GAME START'), 'rgba(40,20,10,.85)', '#FFD24A'],

    mafia_pick: [e && tr(`🕶️ 마피아 ${D(e.who)}의 선택`, `🕶️ MAFIA ${D(e.who)} CHOOSES`), 'rgba(90,10,10,.88)', '#FFB3B3'],

}

function typed(text, lt, dur) { const m = Math.floor(clamp(lt / Math.max(0.3, dur * 0.82)) * text.length); return esc(text.slice(0, m)); }

function drawSub(e, lt) {
  const s = document.getElementById('sub');
  if (!e || !['speech', 'vote'].includes(e.type)) { s.style.display = 'none'; return; }
  s.style.display = 'block';

  if (e.type === 'speech') {
    s.innerHTML = `<div class="who">${nameTag(c)}<span class="emo">${EMO[e.emotion] || '💬'}</span></div><div class="txt">${typed(e.text || '', lt, e.typeDur || e.speak)}</div>`;
  } else {
    s.innerHTML = `<div class="who">🗳️ ${nameTag(c)} → <b style="color:${P[e.target].color}">${D(e.target)}</b></div><div class="txt" style="font-size:28px">${typed(e.reason || '', lt, e.dur * 0.7)}</div>`;
  }
}

function drawClouds(e, lt, toS, inCall) {
  const box = document.getElementById('clouds');
  if (!e || !e.inner || inCall) { box.innerHTML = ''; return; }
  let t0;
  if (e.type === 'speech') t0 = e.speak;
  else if (e.type === 'vote') t0 = e.dur * 0.55;
  else if (['mafia_pick', 'doctor_save', 'police_check'].includes(e.type)) t0 = 1.0;
  else { box.innerHTML = ''; return; }
  const a = ease((lt - t0) / 0.35);
  if (a <= 0) { box.innerHTML = ''; return; }
  const h = toS(head(e.who));
  let x, y;
  if (e.type === 'speech') { x = h.x < 960 ? h.x + 230 : h.x - 230 - 470; y = clamp(h.y - 40, 100, 560); }
  else { x = h.x - 235; y = h.y - 250; }
  x = clamp(x, 290, 1920 - 290 - 470); y = clamp(y, 96, 600);
  const dur = e.type === 'speech' ? e.innerDur : e.dur - t0;
  const tailX = clamp(h.x - x, 30, 440), tailBottom = h.y > y + 120;
  box.innerHTML = `<div class="cloud" style="left:${x}px;top:${y}px;opacity:${a};transform:scale(${lerp(.6, 1, backOut((lt - t0) / 0.45))})">` +
    `<span class="lb">${tr('속마음', 'INNER THOUGHT')}</span>${typed(e.inner, lt - t0, dur)}` +
    (tailBottom ? `<i style="width:26px;height:26px;left:${tailX - 13}px;bottom:-34px"></i><i style="width:14px;height:14px;left:${tailX}px;bottom:-58px"></i>`
      : `<i style="width:24px;height:24px;${h.x < x ? 'left:-30px' : 'right:-30px'};top:40px"></i>`) + `</div>`;
}

function stamp(text, color, x, y, lt, t0, rot = -12, size = 92, until = 1e9) {
  const a = clamp((lt - t0) / 0.18) * (1 - clamp((lt - until) / 0.2));
  if (a <= 0) return '';
  const s = lerp(2.6, 1, easeIn(clamp((lt - t0) / 0.18))) + (lt - t0 > 0.18 ? 0.04 * Math.exp(-(lt - t0 - 0.18) * 8) : 0);
  return `<div class="stamp disp" style="left:${x}px;top:${y}px;color:${color};border-color:${color};font-size:${size}px;opacity:${a};transform:translate(-50%,-50%) rotate(${rot}deg) scale(${s})">${text}</div>`;
}

    h += `<div class="aw-title" style="top:330px;opacity:${a};transform:scale(${lerp(1.35, 1, backOut(t / 0.7))})"><h1 class="disp">${tr('시상식', 'AWARDS')}</h1><p>${(S.runs || []).join(' · ')} · ${tr(`${NRUN}판 결과`, `results of ${NRUN} games`)}</p></div>`;
  }
  // 2) 상 카드 (한 명씩)
  if (t >= AW.title && t < tBoard + 0.4) {
    const i = Math.min(nA - 1, Math.floor((t - AW.title) / AW.per)), u = t - AW.title - i * AW.per, a = S.awards[i], pl = SP(a.model_key);
    const enter = ease(u / 0.45), exit = i < nA - 1 ? ease((u - AW.per + 0.35) / 0.35) : ease((t - tBoard) / 0.4);
    const col = pl.color;
    h += `<div class="awcard" style="--c:${col};border-color:${col};opacity:${enter * (1 - exit)};transform:translateX(${(1 - enter) * 300 - exit * 300}px) scale(${lerp(.92, 1, enter)})">` +
      `<div class="glow"></div><div class="ped" style="transform:translateY(${(1 - backOut((u - 0.1) / 0.5)) * 60}px)">${IMG(pl, 460)}</div>` +
      `<div class="txt"><div class="no">🏆 AWARD ${i + 1} / ${nA}</div><div class="aw disp" style="transform:scale(${lerp(1.25, 1, backOut((u - 0.2) / 0.4))});transform-origin:left center">${esc(L === 'en' ? a.award_en : a.award)}</div>` +
      `<div class="who" style="color:${pl.color}">${esc(sName(a.model_key))}</div><div class="md" style="color:${pl.color}">${esc(pl.model)}</div>` +
      `<div class="metric" style="opacity:${ease((u - 0.6) / 0.4)}">${esc(metricText(a))}</div></div></div>`;
    h += `<div class="awdots">${S.awards.map((_, j) => `<i class="${j <= i ? 'on' : ''}"></i>`).join('')}</div>`;
  }
  // 3) 누적 점수판 → 드럼롤 → 정적
  if (t >= tBoard && t < tWin + 0.3) {
    const order = Object.keys(S.players); // fixed config order (so the champion is not revealed by sorting)
    const max = Math.max(...order.map(k => SP(k).points));
    const champRow = order.indexOf(S.champion);
    const a = ease((t - tBoard - 0.3) / 0.5) * (1 - ease((t - tStill) / 0.4));
    let hl = -1;
    if (t >= tDrum && t < tStill) hl = Math.floor(lerp(0, 3 * order.length + champRow, ease((t - tDrum) / (tStill - tDrum - 0.3)))) % order.length;
    h += `<div class="aw-title" style="top:70px;opacity:${a}"><h1 class="disp" style="font-size:80px">${tr(`${NRUN}판 누적 점수`, `TOTAL POINTS · ${NRUN} GAMES`)}</h1></div><div class="board" style="opacity:${a}">` +
      order.map((k, r) => {
        const pl = SP(k), q = ease((t - tBoard - 0.8 - r * 0.18) / 1.6), dim = hl >= 0 && hl !== r;
        return `<div class="brow" style="opacity:${dim ? .35 : 1};background:${hl === r ? '#FFD24A22' : 'transparent'}"><div class="face" style="border-color:${pl.color}">${IMG(pl, 52)}</div>` +
          `<div class="nm"><b style="color:${pl.color}">${esc(sName(k))}</b><i style="color:${pl.color}">${esc(pl.model)}</i></div>` +
          `<div class="bar" style="width:${(pl.points / max) * 820 * q}px;background:linear-gradient(90deg,${pl.color}99,${pl.color})"></div><div class="pt">${Math.round(pl.points * q)}</div></div>`;
      }).join('') + '</div>';
    if (t >= tDrum && t < tStill) h += `<div class="flash" style="background:radial-gradient(ellipse at 50% 50%, transparent 30%, rgba(0,0,0,${0.5 * ease((t - tDrum) / 0.5)}) 100%)"></div>`;
  }
  if (t >= tStill && t < tWin) {
    h += `<div class="flash" style="background:#000"></div><div class="aw-title" style="top:470px;opacity:${ease((t - tStill - 0.1) / 0.3)}"><p style="font:900 56px 'Noto Sans KR';opacity:1">${tr('최종 우승은…', 'And the winner is…')}</p></div>`;
  }
  // 4) 최종 우승
  if (t >= tWin) {
    const k = S.champion, pl = SP(k), x = t - tWin, col = pl.color;
    h += `<div class="flash" style="background:radial-gradient(ellipse at 50% 46%, ${col}33 0%, rgba(0,0,0,.86) 58%)"></div>`;
    h += `<div class="abs" style="left:610px;top:0;width:700px;height:1000px;clip-path:polygon(38% 0,62% 0,100% 100%,0 100%);background:linear-gradient(#fff4e099, #fff4e000);opacity:${ease(x / 0.4) * 0.55}"></div>`;
    h += `<div class="abs" style="left:0;right:0;top:${250 - 30 * ease(x / 0.8)}px;text-align:center;opacity:${ease(x / 0.4)}">${pl.img ? `<img src="${esc(pl.img)}" style="height:560px;filter:drop-shadow(0 0 40px ${col}aa) drop-shadow(0 20px 30px #000)">` : `<div style="display:inline-block;margin-top:120px">${IMG(pl, 420)}</div>`}</div>`;
    const cy = lerp(-300, 26, ease((x - 0.6) / 0.9)) + (x > 1.5 ? -8 * Math.abs(Math.sin((x - 1.5) * 6)) * Math.exp(-(x - 1.5) * 3) : 0);
    h += `<div class="abs" style="left:0;right:0;top:${cy}px;text-align:center;font-size:190px;filter:drop-shadow(0 0 30px #FFD24A)">👑</div>`;
    h += confetti(tWin + 1.4, t);
    h += `<div class="champ" style="top:800px;opacity:${ease((x - 1.6) / 0.4)};transform:scale(${lerp(1.3, 1, backOut((x - 1.6) / 0.5))})">` +
      `<div class="disp" style="font-size:96px;color:#FFD24A;text-shadow:0 6px 0 #000">${tr('최종 우승', 'CHAMPION')}</div>` +
      `<div style="font:900 44px 'Noto Sans KR';margin-top:4px"><span style="color:${pl.color}">${esc(sName(k))}</span> · <span class="mono" style="color:${pl.color}">${esc(pl.model)}</span> · ${pl.points}${tr('점', ' pts')}</div></div>`;
    h += `<div class="disc" style="bottom:28px;opacity:${ease((x - 4.0) / 0.6) * 0.92}">${tr(`${NRUN}판뿐이라 모델 실력 순위는 아닙니다`, `Only ${NRUN} game${NRUN > 1 ? 's' : ''} played - this is not a ranking of model ability`)}</div>`;
  }
  setHTML(root, h);
}

// ================= arch =================
const faces = keys => `<div class="faces">${keys.map(k => `<span>${IMG(P[byKey[k]], 28)}${esc(P[byKey[k]].model)}</span>`).join('')}</div>`;

while (CLIS.length > 3) { const x = CLIS.pop(); CLIS[2][0] += ' / ' + x[0]; CLIS[2][2].push(...x[2]); }

  [60, 430, 400, 3.8, null, `<h5>🗂️ ${tr('공개 기록', 'Public log')}</h5><div class="s">${tr('발언 · 투표 · 사망 (모두가 봄)', 'speeches · votes · deaths (everyone sees)')}</div>`],

  [1390, 120, 470, 16.0, '#8FD3FF', `<h5>↩️ ${tr('응답 JSON', 'JSON reply')}</h5><div class="json"><span class="p">{</span><span class="k">"speech"</span>: <span class="v">"${tr('여우 님, 근거가 뭔가요?', 'Fox, what is your proof?')}"</span>,\n <span class="k">"emotion"</span>: <span class="v">"${tr('의심', 'suspicious')}"</span>,\n <span class="k">"inner"</span>: <span class="v">"${tr('정체는 숨긴다', 'keep my role hidden')}"</span><span class="p">}</span>\n<span class="p">{</span><span class="k">"vote"</span>: <span class="v">"${tr('여우', 'Fox')}"</span>, <span class="k">"reason"</span>: <span class="v">"…"</span>, <span class="k">"inner"</span>: <span class="v">"…"</span><span class="p">}</span></div>`],

[2, 1].forEach(i => { if (!CLIS[i]) { ARROWS[4 + i][1] = ARROWS[7 + i][1] = 1e9; ARROWS[4 + i][2] = ARROWS[7 + i][2] = 1e9 + 1; } });
const svgA = document.getElementById('arch-svg');
svgA.innerHTML = ARROWS.map(([d, , , c], i) => `<path id="ar-${i}" d="${d}" fill="none" stroke="${c}" stroke-width="3.5" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>`).join('') +
  ARROWS.map((a, i) => [0, 1, 2].map(j => `<circle id="pk-${i}-${j}" r="6" fill="${a[3]}" style="filter:drop-shadow(0 0 6px ${a[3]})"/>`).join('')).join('');
const arPaths = ARROWS.map((a, i) => document.getElementById('ar-' + i));
const arLen = arPaths.map(p => p.getTotalLength());

function drawArch(t) {
  document.querySelectorAll('#s-arch .a, #s-arch .sub').forEach(el => {
    const q = (t - +el.dataset.t) / 0.45;
    el.style.opacity = ease(q);
    el.style.transform = `translateY(${(1 - ease(q)) * 18}px)`;
  });
  ARROWS.forEach(([, t0, t1], i) => {
    const p = clamp((t - t0) / (t1 - t0));
    arPaths[i].setAttribute('stroke-dashoffset', 1 - p);
    for (let j = 0; j < 3; j++) {
      const c = document.getElementById(`pk-${i}-${j}`);
      if (p < 1) { c.setAttribute('opacity', 0); continue; }
      const pt = arPaths[i].getPointAtLength((((t - t1) * 0.55 + j / 3) % 1) * arLen[i]);
      c.setAttribute('cx', pt.x); c.setAttribute('cy', pt.y); c.setAttribute('opacity', 0.95);
    }
  });
  const R = G.result, nums = document.getElementById('a-nums');
  const q = ease((t - 32.6) / 0.6);
  if (q <= 0 || !R) { nums.innerHTML = ''; return; }
  const totalSec = Object.values(R.sec_by_model || {}).reduce((a, b) => a + b, 0);
  const avg = R.calls ? totalSec / R.calls : 0;
  const cards = [[R.calls, tr('한 판 호출 수', 'calls per game'), '#FFD24A'], [avg.toFixed(1) + 's', tr('평균 응답 시간', 'avg response'), '#8FD3FF'], [R.failed_calls ?? 0, tr('실패 호출', 'failed calls'), '#3BE37A']];
  nums.innerHTML = `<div class="flash" style="background:rgba(4,6,12,${0.82 * q})"></div>` + cards.map(([v, l, c], j) => {
    const x = (t - 33.0 - j * 0.35) / 0.5, qq = ease(x);
    const shown = typeof v === 'number' ? Math.round(v * qq) : v;
    return `<div class="numcard" style="left:${180 + j * 560}px;top:330px;border-color:${c};opacity:${qq};transform:scale(${lerp(.7, 1, backOut(x))})"><b style="color:${c}">${shown}</b><span>${l}</span></div>`;
  }).join('') + `<div class="abs" style="left:0;right:0;top:620px;text-align:center;opacity:${ease((t - 34.4) / 0.5)}">` +
    Object.entries(R.sec_by_model || {}).map(([m, s]) => {
      const c = Object.values(P).find(p => p.model === m), n = Object.values(G.result.players || {}).length ? null : null;
      return `<span class="mono" style="display:inline-block;margin:6px 10px;font-size:20px;padding:4px 12px;border-radius:10px;border:2px solid ${c ? c.color : '#fff4'}">${esc(m)}</span>`;
    }).join('') + '</div>' +
    `<div class="abs" style="left:0;right:0;top:760px;text-align:center;font:500 22px 'Noto Sans KR';opacity:${ease((t - 34.8) / 0.5) * .75}">${tr(`${esc(G.run)} 기준 · 응답 시간은 CLI 실측`, `from ${esc(G.run)} · response times measured via the CLIs`)}</div>`;
}

window.seek(0);
if (!Q.get('render')) {
  let t0 = null; const speed = +(Q.get('speed') || 1), from = +(Q.get('t') || 0);
  const loop = ts => { if (t0 === null) t0 = ts; window.seek(from + (ts - t0) / 1000 * speed); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
